# Host tests, lint and a debug build on every push and pull request, the iOS
# targets of :shared, :designsystem and :screens compiled and their tests run on the iOS simulator, plus
# a check that the release script still works on Linux and Windows, run when tools/,
# build.ps1, app/build.gradle.kts (version and signing inputs) or a workflow
# changes, and on every manual run.
# Nothing here is publishable: the CI APK is signed
# with a throwaway debug key generated on the runner, never the Mooscles key,
# and no job has secrets, creates tags or publishes releases.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Host tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and origin/main, for the schema check's merge base.
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties asks for an Adoptium 21 daemon;
      # providing it here avoids a toolchain download on every run.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          @('y') * 10 | & $sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' | Select-Object -Last 3

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Open-source (MIT) provider on top of the GitHub Actions cache.
          cache-provider: basic
          # Pushes to any branch may save the cache; pull requests only read it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Robolectric downloads its android-all jars outside the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # No test retry: a flaky test must fail the job so it gets looked at.
      - name: Test, lint and assemble
        # :shared, :designsystem and :screens register no lint report task of their own (AGP 9.3.3
        # KMP library: only lintAnalyzeAndroidHostTest, which writes no report).
        run: ./gradlew :app:testDebugUnitTest :shared:testAndroidHostTest :designsystem:testAndroidHostTest :screens:testAndroidHostTest :app:lintDebug :app:assembleDebug --console=plain --continue

      # Phase 3 budget: APK growth over the phase's base (main after phase 2), the fonts, and
      # fonts plus icons.
      - name: APK budget
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/check-apk-budget.ps1 -Apk app/build/outputs/apk/debug/app-debug.apk

      # Shapes the digits of the design system fonts with HarfBuzz, with and without tnum,
      # and checks each file against the SHA-256 lock. A host-side indicator: the device
      # proof is TnumRegressionTest on the iOS simulator (job ios) and the emulator.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: '3.13'

      - name: Font check (HarfBuzz)
        if: ${{ !cancelled() }}
        # Explicit bash: -o pipefail, so the script's exit code survives tee. Every font must
        # have tabular figures with tnum; Inter (the text face) must be proportional without it.
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check fonttools==4.68.0 uharfbuzz==0.57.0
          python3 -I tools/check_fonts.py designsystem/src/commonMain/composeResources/font/*.ttf \
            --lock designsystem/font-sources.txt --require-tabular '*' --require-proportional 'inter*' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Components, the gallery, the licenses page and the :screens common code may not hard-code
      # colors, measures or durations: those live in designsystem/.../tokens/. The two fixtures prove the guard
      # still catches (8 violating lines) and still passes clean code.
      - name: Design token guard
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          ./tools/check-design-tokens.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Design token violations in the design system.' }
          ./tools/check-design-tokens.ps1 -Path tools/fixtures/design-tokens/clean.kt.txt
          if ($LASTEXITCODE -ne 0) { throw 'The guard flagged the clean fixture.' }
          $found = @(./tools/check-design-tokens.ps1 -Path tools/fixtures/design-tokens/violations.kt.txt)
          if ($LASTEXITCODE -ne 1) { throw "The guard exited $LASTEXITCODE on the violations fixture; expected 1." }
          $lines = @($found | Where-Object { $_ -match 'violations\.kt\.txt:\d+:' })
          if ($lines.Count -ne 8) { throw "The guard reported $($lines.Count) violating lines; expected 8." }
          # The expected exit code 1 above would otherwise become the step's exit code.
          exit 0

      # The exported JSON is a contract with installed databases. Room writes shared/schemas
      # only when a schema changed (otherwise the copy task is NO-SOURCE), so a build that
      # regenerates a different or new file fails here. Against the merge base with main,
      # an existing schema file may never change or disappear; only a new N+1 file may appear.
      - name: Room schemas unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- shared/schemas
          status=$(git status --porcelain -- shared/schemas)
          if [ -n "$status" ]; then
            echo "Room schema files changed or appeared:"
            echo "$status"
            exit 1
          fi
          base=$(git merge-base origin/main HEAD)
          git diff --exit-code --no-renames --diff-filter=MD "$base" -- shared/schemas
          # Before :shared the schemas lived in app/schemas: each must still exist, unchanged.
          for file in $(git ls-tree -r --name-only "$base" -- app/schemas); do
            git diff --exit-code "$base:$file" "HEAD:shared/${file#app/}"
          done

      - name: Summarize host tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # The host total before :shared existed. Moving tests between the two
          # modules must never lose any, so the sum may not drop below it.
          # Raised to the real count after phase 2: 624 (:app 377, :shared 181, :designsystem 66).
          # Phase 3 task 4: DataErrorsTest +3, UiErrorsTest +7, WorkoutRepositoryErrorTypesTest +5,
          # AppViewModelErrorCodeHostTest +4, RestTimerControllerTest +1.
          # Phase 3 task 5: WorkoutPresentationTest +14, WorkoutCalculationsTest +2, WorkoutCalculationsBatchTest +1.
          # Phase 3 task 6: WorkoutSetRestoreTest +8, AppViewModelRestoreHostTest +5.
          # Phase 3 tasks 7 and 8: SetSuggestionsTest +20, InProcessRestTimerTest +12 (shared).
          # Phase 3 task 9 (:screens): StringsParityTest 6, EquipmentIconsTest 1;
          # DesignSystemResourcesHostTest +1 (:app).
          # Phase 3 task 10 (:screens): ScreenDatesTest 4 (commonTest), ScreenDatesJvmEquivalenceTest 2.
          # Phase 3 task 11 (:designsystem commonTest): IconsTest +1, SizesTimingElevationTest +1.
          # Phase 3 task 27 (:app): UpdaterDisabledHostTest 2, LauncherIconHostTest 1.
          # Phase 3 task 13 (:designsystem commonTest): SizesTimingElevationTest +1.
          # Phase 3 task 14 (:screens commonTest): ActiveWorkoutScreenStateTest 2.
          # Phase 3 task 15 (:screens commonTest): SetDraftsTest 7.
          # Phase 3 task 26: WorkoutShareCardTest -19 (removed with the Android card data),
          # WorkoutCardRendererTest +4 (5 -> 9); :screens commonTest ShareCardDataTest 23, ShareCardColorsTest 1.
          # Phase 3 task 16 (:screens commonTest): ActiveWorkoutScreenStateTest +2.
          # Phase 3 task 22 (:screens commonTest): SummaryStatsTest 6.
          MIN_HOST_TESTS: 752
        run: |
          $files = @(
              'app/build/test-results/testDebugUnitTest',
              'shared/build/test-results/testAndroidHostTest',
              'designsystem/build/test-results/testAndroidHostTest',
              'screens/build/test-results/testAndroidHostTest'
          ) | ForEach-Object { Get-ChildItem -Path $_ -Filter '*.xml' -ErrorAction SilentlyContinue }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0; $failed = @()
          foreach ($file in $files) {
              $suite = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite
              $tests += [int]$suite.tests; $failures += [int]$suite.failures
              $errors += [int]$suite.errors; $skipped += [int]$suite.skipped
              foreach ($case in @($suite.testcase)) {
                  if ($case.failure -or $case.error) { $failed += "$($case.classname).$($case.name)" }
              }
          }
          $minimum = [int]$env:MIN_HOST_TESTS
          $lines = @(
              '### Host tests',
              "$tests tests in $($files.Count) classes (:app, :shared, :designsystem and :screens): $failures failed, $errors errors, $skipped skipped. Minimum: $minimum."
          ) + ($failed | ForEach-Object { "- ``$_``" })
          $lines | Write-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($tests -lt $minimum) { throw "Only $tests host tests ran; at least $minimum are expected." }

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-reports
          path: |
            app/build/reports/
            app/build/test-results/
            shared/build/reports/
            shared/build/test-results/
            designsystem/build/reports/
            designsystem/build/test-results/
            screens/build/reports/
            screens/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # For inspection and for the release-script job only. It is signed with the
      # runner's throwaway debug key, so installed Mooscles builds reject it.
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  # Compiles the iOS device targets of :shared, :designsystem and :screens and runs their tests
  # (common tests, plus the design system and screen UI tests) on the iOS simulator. Only a Mac
  # can build Kotlin/Native Apple targets.
  ios:
    name: iOS compile and simulator tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode 26.4 is the version the Kotlin 2.4.20-2.4.21 compatibility table
      # lists. On the macos-26 image Xcode_26.4.app links to Xcode_26.4.1.app.
      - name: Select Xcode 26.4
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          xcodebuild -version

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Gradle configures :app as well, so the Android SDK must be complete here too.
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          @('y') * 10 | & $sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' | Select-Object -Last 3

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Kotlin/Native keeps its compiler and the Apple platform libraries in
      # ~/.konan, outside the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'designsystem/build.gradle.kts', 'screens/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile for iOS and run the simulator tests
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test :designsystem:compileKotlinIosArm64 :designsystem:iosSimulatorArm64Test :screens:compileKotlinIosArm64 :screens:iosSimulatorArm64Test --console=plain --continue

      # kspIosArm64 and kspIosSimulatorArm64 run only here, so an iOS-only divergence in the
      # exported schema (and its identityHash) is caught here, not in the host job.
      - name: Room schemas unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- shared/schemas
          status=$(git status --porcelain -- shared/schemas)
          if [ -n "$status" ]; then
            echo "Room schema files changed or appeared:"
            echo "$status"
            exit 1
          fi

      - name: Summarize iOS simulator tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # The common tests in :shared (156 after phase 2, 183 with the lines below)
          # plus the iOS-only entry point tests (6). Raise it when tests move into
          # commonTest or iosTest, so a silently skipped class fails the job.
          # Phase 3 task 4: DataErrorsTest +3, UiErrorsTest +7.
          # Phase 3 task 5: WorkoutPresentationTest +14, WorkoutCalculationsTest +2, WorkoutCalculationsBatchTest +1.
          MIN_IOS_TESTS: 221
        run: |
          $files = @(Get-ChildItem -Path 'shared/build/test-results/iosSimulatorArm64Test' -Filter '*.xml' -ErrorAction SilentlyContinue)
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0; $failed = @(); $platform = @()
          foreach ($file in $files) {
              $suite = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite
              $tests += [int]$suite.tests; $failures += [int]$suite.failures
              $errors += [int]$suite.errors; $skipped += [int]$suite.skipped
              foreach ($case in @($suite.testcase)) {
                  if ($case.failure -or $case.error) { $failed += "$($case.classname).$($case.name)" }
                  # The iosTest classes (database and preferences entry points) are listed by name.
                  if ($case.classname -match '\.Ios[A-Za-z]+Test\b') {
                      $result = if ($case.failure -or $case.error) { 'failed' } elseif ($null -ne $case.SelectSingleNode('skipped')) { 'skipped' } else { 'passed' }
                      $platform += "- ``$($case.classname).$($case.name)``: $result"
                  }
              }
          }
          $minimum = [int]$env:MIN_IOS_TESTS
          $lines = @(
              '### iOS simulator tests',
              "$tests tests in $($files.Count) classes: $failures failed, $errors errors, $skipped skipped. Minimum: $minimum."
          ) + ($failed | ForEach-Object { "- ``$_``" }) + @('', 'iOS entry point tests:') + $platform
          $lines | Write-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($files.Count -eq 0) { throw 'No iOS simulator test results were written.' }
          if ($tests -lt $minimum) { throw "Only $tests iOS simulator tests ran; at least $minimum are expected." }
          if ($platform.Count -ne 6) { throw "$($platform.Count) iOS entry point tests ran; exactly 6 are expected (update this number and MIN_IOS_TESTS when adding or removing one)." }

      # The design system on its own, so a skipped :designsystem class cannot hide behind
      # the :shared total above.
      - name: Summarize design system iOS simulator tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # Per class: TnumRegressionTest 6, ThemeTest 2, GallerySmokeTest 7, PrimitiveColorsTest 1,
          # ContrastMathTest 3, ContrastTokensTest 5, SemanticColorsTest 2, TypographyTokensTest 3,
          # SpaceTokensTest 4, SizesTimingElevationTest 3, MotionTokensTest 3, ReducedMotionTest 1, IconsTest 4,
          # MoosclesNumbersTest 8, PluralCountTest 2, AppLocaleTest 3, HapticsMappingTest 3, MotionPolicyTest 3,
          # FocusRingTest 1, MButtonTest 4, MIconButtonTest 2, MChipTest 2, RowsTest 5, MTextTest 2, MSwitchTest 2, MRadioTest 1,
          # MTextFieldTest 6, MProgressBarTest 3, FeedbackTest 5, MDialogTest 4, MBottomSheetTest 2, MToastTest 5,
          # NumericInputTest 4, NumericFieldTest 3, StepperTest 7, SetCheckTest 4, SetRowTest 16, PrBadgeTest 1,
          # RestTimerRingMathTest 3, RestTimerDockTest 9, RestTimerExpandedTest 5, PrToastTest 3, ExerciseCardTest 6,
          # ComponentColorsTest 5. Task 16 critique: LicenseTextTest 5, MButtonIconScaleTest 1, GallerySmokeTest +4, FullWidthTest 3.
          # Final fix wave: StepperTest +4, MToastTest +2, MDialogTest +2, RestTimerDockTest +1, RestTimerExpandedTest +2, TextFitTest 3.
          # Set row density fix: SetRowTest +4.
          # Phase 3 task 11: IconsTest +1, SizesTimingElevationTest +1, MTabBarTest 8, ActiveWorkoutBarTest 7.
          # Phase 3 task 12: SetRowTest +9, SetRowSwipeTest 5, NumericFieldTest +3, StepperTest +6.
          # Task 12 review fixes: SetRowSwipeTest +7, StepperTest +2, NumericFieldTest +2, SetRowTest +1.
          # Phase 3 task 13: ExerciseCardTest +5, RestTimerDockTest +2, RestTimerExpandedTest +4, RestTimerCompactTest 3,
          # SizesTimingElevationTest +1. Swipe settle restart fix: SetRowSwipeTest +1.
          # Raise it in every task that adds design system tests to commonTest, iosTest or uiTest.
          MIN_DS_IOS_TESTS: 272
        run: |
          $files = @(Get-ChildItem -Path 'designsystem/build/test-results/iosSimulatorArm64Test' -Filter '*.xml' -ErrorAction SilentlyContinue)
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0; $failed = @()
          foreach ($file in $files) {
              $suite = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite
              $tests += [int]$suite.tests; $failures += [int]$suite.failures
              $errors += [int]$suite.errors; $skipped += [int]$suite.skipped
              foreach ($case in @($suite.testcase)) {
                  if ($case.failure -or $case.error) { $failed += "$($case.classname).$($case.name)" }
              }
          }
          $minimum = [int]$env:MIN_DS_IOS_TESTS
          $lines = @(
              '### Design system iOS simulator tests',
              "$tests tests in $($files.Count) classes: $failures failed, $errors errors, $skipped skipped. Minimum: $minimum."
          ) + ($failed | ForEach-Object { "- ``$_``" })
          $lines | Write-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($files.Count -eq 0) { throw 'No design system iOS simulator test results were written.' }
          if ($tests -lt $minimum) { throw "Only $tests design system iOS simulator tests ran; at least $minimum are expected." }

      # The screens on their own, for the same reason.
      - name: Summarize screens iOS simulator tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # Per class: EquipmentIconsTest 1, ScreenDatesTest 4, ActiveWorkoutScreenStateTest 4, SetDraftsTest 7,
          # ShareCardDataTest 23, ShareCardColorsTest 1 (commonTest); CatalogLabelsTest 4, ScreensHelpersTest 4,
          # DateTextsTest 5, WorkoutSetRowTest 13, SetEditingTest 23, SetTypeAndRemovalTest 14, ShareCardPainterTest 4,
          # ShareCardTextsTest 2 (uiTest).
          # Task 22: SummaryStatsTest 6 (commonTest), WorkoutSummaryScreenTest 11 (uiTest).
          # Raise it in every task that adds screen tests to commonTest, iosTest or uiTest.
          MIN_SCREENS_IOS_TESTS: 126
        run: |
          $files = @(Get-ChildItem -Path 'screens/build/test-results/iosSimulatorArm64Test' -Filter '*.xml' -ErrorAction SilentlyContinue)
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0; $failed = @()
          foreach ($file in $files) {
              $suite = ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite
              $tests += [int]$suite.tests; $failures += [int]$suite.failures
              $errors += [int]$suite.errors; $skipped += [int]$suite.skipped
              foreach ($case in @($suite.testcase)) {
                  if ($case.failure -or $case.error) { $failed += "$($case.classname).$($case.name)" }
              }
          }
          $minimum = [int]$env:MIN_SCREENS_IOS_TESTS
          $lines = @(
              '### Screens iOS simulator tests',
              "$tests tests in $($files.Count) classes: $failures failed, $errors errors, $skipped skipped. Minimum: $minimum."
          ) + ($failed | ForEach-Object { "- ``$_``" })
          $lines | Write-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($files.Count -eq 0) { throw 'No screens iOS simulator test results were written.' }
          if ($tests -lt $minimum) { throw "Only $tests screens iOS simulator tests ran; at least $minimum are expected." }

      - name: Upload iOS reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-reports
          path: |
            shared/build/reports/
            shared/build/test-results/
            designsystem/build/reports/
            designsystem/build/test-results/
            screens/build/reports/
            screens/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Decides whether the release-script matrix is worth running. It fails open:
  # a manual run, a missing or unknown base commit, a failed diff or a failure
  # of this job itself all mean "run the release-script checks".
  changes:
    name: Detect release tooling changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-tooling: ${{ steps.diff.outputs.release-tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the base commit
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          # Pull requests: the PR's own commits since it left the base branch.
          # Pushes: everything between the previous tip and this one.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          decide() {
            echo "release-tooling=$1" >> "$GITHUB_OUTPUT"
            echo "release-script: $1 ($2)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$EVENT" in
            push) range="$BASE..$HEAD_SHA" ;;
            pull_request) range="$BASE...$HEAD_SHA" ;;
            *) decide true "$EVENT event always runs it" ;;
          esac
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then decide true "no base commit (new branch or tag)"; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            decide true "base $BASE or head $HEAD_SHA is not in the fetched history"
          fi
          if ! files=$(git diff --name-only "$range"); then decide true "git diff $range failed"; fi
          matched=$(printf '%s\n' "$files" | grep -E '^(tools/|build\.ps1$|app/build\.gradle\.kts$|\.github/workflows/)' || true)
          if [ -n "$matched" ]; then decide true "release tooling changed in $range: $(echo $matched)"; fi
          decide false "no file under tools/, build.ps1, app/build.gradle.kts or .github/workflows/ changed in $range"

  release-script:
    name: Release script (${{ matrix.os }}, ${{ matrix.sdk }})
    needs: [host, changes]
    # Still needs a green host job (it uses its APK). Anything but an explicit
    # "false" from changes, including an empty output after a failure, runs it.
    if: ${{ !cancelled() && needs.host.result == 'success' && needs.changes.outputs.release-tooling != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # build-tools-35: an SDK holding only the project's build-tools 35.0.0.
        # runner-sdk: the runner's own SDK, where the script picks the newest
        # build-tools (37.x today), whose apksigner prints a different format.
        sdk: [build-tools-35, runner-sdk]
    defaults:
      run:
        shell: pwsh
    env:
      APK: app/build/outputs/apk/debug/app-debug.apk
      SDK_VARIANT: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug

      # apksigner and sdkmanager need a recent JDK on PATH.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # prepare-release.ps1 uses the newest build-tools in the SDK it finds. The
      # build-tools-35 variant gives it an SDK with only 35.0.0, as on a release
      # machine; the runner-sdk variant lets it pick from the runner's SDK.
      - name: Install build-tools 35.0.0
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          if ($IsWindows) { $sdkmanager += '.bat' }
          @('y') * 10 | & $sdkmanager --install 'build-tools;35.0.0' | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager exited $LASTEXITCODE." }
          $releaseSdk = Join-Path $env:RUNNER_TEMP 'release-sdk'
          $source = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          New-Item -ItemType Directory -Force -Path (Join-Path $releaseSdk 'build-tools') | Out-Null
          if ($IsWindows) {
              Copy-Item -Recurse -LiteralPath $source -Destination (Join-Path $releaseSdk 'build-tools/35.0.0')
          } else {
              & cp -a $source (Join-Path $releaseSdk 'build-tools/35.0.0')
          }
          "RELEASE_SDK=$releaseSdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $scriptSdk = if ($env:SDK_VARIANT -eq 'build-tools-35') { $releaseSdk } else { '' }
          "SCRIPT_SDK=$scriptSdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PowerShell $($PSVersionTable.PSVersion), ANDROID_HOME=$env:ANDROID_HOME, ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Get-ChildItem -Name (Join-Path $env:ANDROID_HOME 'build-tools') | ForEach-Object { "runner build-tools: $_" }
          # Same choice the script makes, to show which apksigner this variant exercises.
          $aapt = if ($IsWindows) { 'aapt.exe' } else { 'aapt' }
          $signerTool = if ($IsWindows) { 'apksigner.bat' } else { 'apksigner' }
          $sdkUsed = if ($scriptSdk) { $scriptSdk } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $picked = Get-ChildItem -LiteralPath (Join-Path $sdkUsed 'build-tools') -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending |
              Where-Object { (Test-Path (Join-Path $_.FullName $aapt)) -and (Test-Path (Join-Path $_.FullName $signerTool)) } |
              Select-Object -First 1
          $line = "prepare-release ($env:SDK_VARIANT) uses build-tools $($picked.Name) from $sdkUsed"
          Write-Host $line
          $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Read the CI signing certificate
        id: signer
        run: |
          $apksigner = Join-Path (Join-Path $env:RELEASE_SDK 'build-tools/35.0.0') ($IsWindows ? 'apksigner.bat' : 'apksigner')
          $certs = @(& $apksigner verify --print-certs $env:APK 2>&1 | ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0) { throw "apksigner failed:`n$($certs -join "`n")" }
          $digests = @($certs | ForEach-Object {
              if ($_ -match '^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$') { $Matches[1].ToLowerInvariant() }
          })
          if ($digests.Count -ne 1) { throw "Expected exactly one signer:`n$($certs -join "`n")" }
          # The script's default is the original Mooscles key; read it from the script itself.
          $script = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'tools/prepare-release.ps1').Path, [ref]$null, [ref]$null)
          $default = ($script.ParamBlock.Parameters |
              Where-Object { $_.Name.VariablePath.UserPath -eq 'ExpectedSignerSha256' }).DefaultValue.Value
          if ($default -notmatch '^[0-9a-f]{64}$') { throw 'Could not read the default ExpectedSignerSha256 from prepare-release.ps1.' }
          if ($digests[0] -eq $default) { throw 'The CI APK is signed with the original Mooscles key. CI must never have that key.' }
          Write-Host "CI signer:       $($digests[0])"
          Write-Host "Original signer: $default"
          "sha256=$($digests[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: prepare-release accepts the CI key when told to
        env:
          CI_SIGNER_SHA256: ${{ steps.signer.outputs.sha256 }}
        run: |
          $sdkArgs = @{}
          if ($env:SCRIPT_SDK) { $sdkArgs['AndroidSdkDirectory'] = $env:SCRIPT_SDK }
          $result = & ./tools/prepare-release.ps1 -ApkPath $env:APK @sdkArgs -ExpectedSignerSha256 $env:CI_SIGNER_SHA256 -PreviousVersionCode 15
          $result | Format-List | Out-String | Write-Host
          $metadata = Get-Content -LiteralPath $result.MetadataPath -Raw | ConvertFrom-Json
          $expected = @('applicationId', 'versionCode', 'versionName', 'minSdk', 'apkFileName', 'apkSize', 'sha256')
          $names = @($metadata.PSObject.Properties.Name)
          if (($names -join ',') -ne ($expected -join ',')) { throw "update.json fields are [$($names -join ', ')], expected [$($expected -join ', ')]." }
          foreach ($name in $expected) { if ("$($metadata.$name)" -eq '') { throw "update.json field $name is empty." } }
          if ($metadata.applicationId -ne 'com.mooscles') { throw "Unexpected applicationId $($metadata.applicationId)." }
          if ([long]$metadata.versionCode -le 15) { throw "versionCode $($metadata.versionCode) is not above 15." }
          $releaseApk = Join-Path (Split-Path -Parent $result.MetadataPath) $metadata.apkFileName
          $releaseSha = (Get-FileHash -LiteralPath $releaseApk -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceSha = (Get-FileHash -LiteralPath $env:APK -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.sha256 -ne $releaseSha -or $releaseSha -ne $sourceSha) {
              throw "sha256 mismatch: update.json $($metadata.sha256), release copy $releaseSha, built APK $sourceSha."
          }
          if ([long]$metadata.apkSize -ne (Get-Item -LiteralPath $releaseApk).Length) { throw 'apkSize does not match the release copy.' }
          $checksum = (Get-Content -LiteralPath $result.ChecksumPath -Raw).Trim()
          if ($checksum -ne "$releaseSha  $($metadata.apkFileName)") { throw "Unexpected .sha256 content: $checksum" }
          if ($result.SignerSha256 -ne $env:CI_SIGNER_SHA256) { throw 'prepare-release reported a different signer.' }
          Get-Content -LiteralPath $result.MetadataPath | Write-Host

      - name: prepare-release refuses the CI key by default
        env:
          NO_COLOR: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $refusedDirectory = 'app/build/outputs/release-default-key'
          $sdkArgs = @{}
          $sdkArgList = @()
          if ($env:SCRIPT_SDK) {
              $sdkArgs['AndroidSdkDirectory'] = $env:SCRIPT_SDK
              $sdkArgList = @('-AndroidSdkDirectory', $env:SCRIPT_SDK)
          }
          # In-process: the exact error message.
          $message = $null
          try {
              & ./tools/prepare-release.ps1 -ApkPath $env:APK @sdkArgs -PreviousVersionCode 15 -OutputDirectory $refusedDirectory | Out-Null
          } catch {
              $message = $_.Exception.Message
          }
          if (-not $message) { throw 'prepare-release accepted an APK that is not signed with the original Mooscles key.' }
          if ($message -notlike '*Do not create a new key*') { throw "prepare-release failed for another reason: $message" }
          # As a release operator runs it: a separate process that must exit non-zero.
          $output = @(& pwsh -NoProfile -NonInteractive -File ./tools/prepare-release.ps1 -ApkPath $env:APK @sdkArgList -PreviousVersionCode 15 -OutputDirectory $refusedDirectory 2>&1 | ForEach-Object { "$_" })
          $exitCode = $LASTEXITCODE
          $text = $output -join "`n"
          Write-Host $text
          if ($exitCode -eq 0) { throw 'prepare-release exited 0 for an APK that is not signed with the original Mooscles key.' }
          # Undo the error view's line wrapping before matching.
          $flat = (($text -replace '\x1b\[[0-9;]*m', '') -replace '\s*\|\s*', ' ') -replace '\s+', ' '
          if ($flat -notlike '*Do not create a new key*') { throw "prepare-release exited $exitCode for another reason." }
          if (Test-Path -LiteralPath (Join-Path $refusedDirectory 'update.json')) { throw 'prepare-release wrote update.json despite refusing the key.' }
          Write-Host "Refused as expected (exit $exitCode): $message"
          exit 0

      # Two keys made here, in the runner's temp directory, only for this check;
      # they are not secrets and never leave the runner.
      - name: Sign two-signer and rotated APKs with throwaway keys
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $work = Join-Path $env:RUNNER_TEMP 'signer-cases'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $apksigner = Join-Path (Join-Path $env:RELEASE_SDK 'build-tools/35.0.0') ($IsWindows ? 'apksigner.bat' : 'apksigner')
          $keytool = Join-Path $env:JAVA_HOME ($IsWindows ? 'bin/keytool.exe' : 'bin/keytool')
          function Invoke-Tool($tool) {
              $output = @(& $tool @args 2>&1 | ForEach-Object { "$_" })
              if ($LASTEXITCODE -ne 0) { throw "$(Split-Path -Leaf $tool) exited $($LASTEXITCODE):`n$($output -join "`n")" }
              $output
          }
          $one = Join-Path $work 'one.jks'
          $two = Join-Path $work 'two.jks'
          foreach ($key in @(@($one, 'one'), @($two, 'two'))) {
              Invoke-Tool $keytool -genkeypair -keystore $key[0] -storepass throwaway -keypass throwaway -alias $key[1] `
                  -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Mooscles CI throwaway $($key[1])" | Out-Null
          }
          $twoSigners = Join-Path $work 'two-signers.apk'
          $lineage = Join-Path $work 'lineage'
          $rotated = Join-Path $work 'rotated.apk'
          # v3 accepts several certificates only as a rotation lineage, so the
          # two-signer APK carries v1/v2 signatures by both keys.
          Invoke-Tool $apksigner sign --ks $one --ks-pass pass:throwaway --v1-signer-name ONE `
              --next-signer --ks $two --ks-pass pass:throwaway --v1-signer-name TWO `
              --v3-signing-enabled false --out $twoSigners $env:APK | Out-Null
          Invoke-Tool $apksigner rotate --out $lineage `
              --old-signer --ks $one --ks-pass pass:throwaway `
              --new-signer --ks $two --ks-pass pass:throwaway | Out-Null
          Invoke-Tool $apksigner sign --ks $one --ks-pass pass:throwaway `
              --next-signer --ks $two --ks-pass pass:throwaway `
              --lineage $lineage --rotation-min-sdk-version 33 --out $rotated $env:APK | Out-Null
          # Build Tools 35 print "Signer #1 ..." for two signers and "Signer (minSdkVersion=...) ..."
          # for a rotation; both APKs must name the same two certificates.
          $digestsOf = {
              param($apk)
              @(Invoke-Tool $apksigner verify --print-certs $apk | ForEach-Object {
                  if ($_ -match '^Signer[^:]* certificate SHA-256 digest: ([0-9a-fA-F]{64})$') { $Matches[1].ToLowerInvariant() }
              } | Sort-Object -Unique)
          }
          $twoDigests = & $digestsOf $twoSigners
          $rotatedDigests = & $digestsOf $rotated
          Write-Host "two-signer APK: $($twoDigests -join ', ')"
          Write-Host "rotated APK:    $($rotatedDigests -join ', ')"
          if ($twoDigests.Count -ne 2) { throw 'The two-signer APK does not carry two distinct certificates.' }
          if (($rotatedDigests -join ',') -ne ($twoDigests -join ',')) { throw 'The rotated APK does not carry the same two certificates.' }
          "TWO_SIGNERS_APK=$twoSigners" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ROTATED_APK=$rotated" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "THROWAWAY_SIGNERS=$($twoDigests -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # An APK signed by the expected certificate and any other one must be
      # refused, even when the expected certificate is one of its signers.
      - name: prepare-release refuses two signers and a key rotation
        run: |
          $sdkArgs = @{}
          if ($env:SCRIPT_SDK) { $sdkArgs['AndroidSdkDirectory'] = $env:SCRIPT_SDK }
          $cases = [ordered]@{ 'two-signers' = $env:TWO_SIGNERS_APK; 'rotation' = $env:ROTATED_APK }
          $index = 0
          foreach ($case in $cases.Keys) {
              foreach ($expected in ($env:THROWAWAY_SIGNERS -split ',')) {
                  $index++
                  $refusedDirectory = "app/build/outputs/release-$case-$index"
                  $message = $null
                  try {
                      & ./tools/prepare-release.ps1 -ApkPath $cases[$case] @sdkArgs -ExpectedSignerSha256 $expected -PreviousVersionCode 15 -OutputDirectory $refusedDirectory | Out-Null
                  } catch {
                      $message = $_.Exception.Message
                  }
                  if (-not $message) { throw "prepare-release accepted the $case APK when told to trust $expected." }
                  if ($message -notlike '*Do not create a new key*') { throw "prepare-release refused the $case APK for another reason: $message" }
                  if (Test-Path -LiteralPath (Join-Path $refusedDirectory 'update.json')) { throw "prepare-release wrote update.json for the $case APK." }
                  Write-Host "Refused $case with trusted signer $expected."
              }
          }

      # Windows PowerShell 5.1 ships with Windows, so a release operator may run
      # the script with it instead of PowerShell 7.
      - name: Windows PowerShell 5.1 runs the release script
        if: ${{ runner.os == 'Windows' }}
        env:
          CI_SIGNER_SHA256: ${{ steps.signer.outputs.sha256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (& powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
          Write-Host "Windows PowerShell $version"
          if ($version -notlike '5.1.*') { throw "powershell.exe is $version, not Windows PowerShell 5.1." }
          $sdkArgList = @()
          if ($env:SCRIPT_SDK) { $sdkArgList = @('-AndroidSdkDirectory', $env:SCRIPT_SDK) }
          function Invoke-WindowsPowerShell {
              $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/prepare-release.ps1 @args 2>&1 | ForEach-Object { "$_" })
              Write-Host ($output -join "`n")
              [pscustomobject]@{ ExitCode = $LASTEXITCODE; Text = ($output -join "`n") }
          }

          $acceptedDirectory = 'app/build/outputs/release-ps51'
          $run = Invoke-WindowsPowerShell -ApkPath $env:APK @sdkArgList -ExpectedSignerSha256 $env:CI_SIGNER_SHA256 -PreviousVersionCode 15 -OutputDirectory $acceptedDirectory
          if ($run.ExitCode -ne 0) { throw "Windows PowerShell 5.1 exited $($run.ExitCode) for the CI key it was told to trust." }
          $metadata = Get-Content -LiteralPath (Join-Path $acceptedDirectory 'update.json') -Raw | ConvertFrom-Json
          $expected = @('applicationId', 'versionCode', 'versionName', 'minSdk', 'apkFileName', 'apkSize', 'sha256')
          $names = @($metadata.PSObject.Properties.Name)
          if (($names -join ',') -ne ($expected -join ',')) { throw "update.json fields are [$($names -join ', ')], expected [$($expected -join ', ')]." }
          if ($metadata.applicationId -ne 'com.mooscles') { throw "Unexpected applicationId $($metadata.applicationId)." }
          $releaseApk = Join-Path $acceptedDirectory $metadata.apkFileName
          $releaseSha = (Get-FileHash -LiteralPath $releaseApk -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceSha = (Get-FileHash -LiteralPath $env:APK -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.sha256 -ne $releaseSha -or $releaseSha -ne $sourceSha) {
              throw "sha256 mismatch: update.json $($metadata.sha256), release copy $releaseSha, built APK $sourceSha."
          }
          if ([long]$metadata.apkSize -ne (Get-Item -LiteralPath $releaseApk).Length) { throw 'apkSize does not match the release copy.' }
          $checksum = (Get-Content -LiteralPath (Join-Path $acceptedDirectory "$($metadata.apkFileName).sha256") -Raw).Trim()
          if ($checksum -ne "$releaseSha  $($metadata.apkFileName)") { throw "Unexpected .sha256 content: $checksum" }

          $refusedDirectory = 'app/build/outputs/release-ps51-default-key'
          $run = Invoke-WindowsPowerShell -ApkPath $env:APK @sdkArgList -PreviousVersionCode 15 -OutputDirectory $refusedDirectory
          if ($run.ExitCode -eq 0) { throw 'Windows PowerShell 5.1 exited 0 for an APK that is not signed with the original Mooscles key.' }
          # Windows PowerShell wraps long error lines; compare without whitespace.
          if (($run.Text -replace '\s', '') -notlike '*Donotcreateanewkey*') { throw "Windows PowerShell 5.1 exited $($run.ExitCode) for another reason." }
          if (Test-Path -LiteralPath (Join-Path $refusedDirectory 'update.json')) { throw 'Windows PowerShell 5.1 wrote update.json despite refusing the key.' }
          Write-Host "Windows PowerShell 5.1 accepted the trusted key and refused the default (exit $($run.ExitCode))."
          exit 0
